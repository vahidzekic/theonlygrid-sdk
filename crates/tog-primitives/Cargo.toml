[package]
name = "tog-primitives"
description = "Hashing, commitments and base types shared by every TOG component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not inherited from the workspace: `std` is a feature here, so the no_std+alloc build
# (`--no-default-features`, e.g. for wasm32 runtimes, TOG-SPEC-0007 §0) leaves it off.
[dependencies]
blake3 = { version = "1.6", default-features = false }
borsh = { version = "1", default-features = false, features = ["derive"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize", "precomputed-tables"] }
sha2 = { version = "0.10", default-features = false }
thiserror = { version = "2", default-features = false }
tiny-keccak.workspace = true
zeroize = { version = "1", default-features = false }

[features]
default = ["std"]
std = ["blake3/std", "borsh/std", "curve25519-dalek/default", "sha2/std", "thiserror/std"]

[lints]
workspace = true
