[package]
name = "tog-runtime-template"
description = "AppChain SDK template runtime: the standard modules, sudo and the executive (TOG-SPEC-0007 §7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = { version = "1", default-features = false, features = ["derive"] }
tog-runtime-core = { path = "../tog-runtime-core", default-features = false }
tog-runtime-io = { path = "../tog-runtime-io" }
tog-runtime-modules = { path = "../tog-runtime-modules", default-features = false }
tog-types = { path = "../tog-types", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tog-runtime-io = { path = "../tog-runtime-io", features = ["runtime"] }

[lints]
workspace = true
